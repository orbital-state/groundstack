events {}

http {
  # Minimal TLS reverse proxy placeholder.
  # NOTE: This will not work until certs are provided in examples/edge/certs.

  # Docker embedded DNS server.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;

      # Use a variable so nginx resolves the upstream at request time.
      set $upstream "turquoise-api:8080";
      proxy_pass http://$upstream;
    }
  }
}
